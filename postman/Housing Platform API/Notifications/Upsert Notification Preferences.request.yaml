$kind: http-request
url: "{{baseUrl}}/api/v1/notifications/me/preferences"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "channelEventMap": {
        "BILL_GENERATED": ["IN_APP", "EMAIL"],
        "TICKET_STATUS_CHANGED": ["IN_APP"],
        "PAYMENT_DUE": ["EMAIL"]
      }
    }
order: 5000
