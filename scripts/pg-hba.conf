# scripts/pg-hba.conf — local docker-compose development pg_hba
#
# Postgres only listens on the Docker host loopback in dev, so trust over TCP
# is safe. Production uses managed Postgres (Neon / Supabase / Render) and
# inherits that provider's pg_hba — we don't touch it.
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
host    all             all             all                     trust
