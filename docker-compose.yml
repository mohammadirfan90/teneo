# docker-compose.yml — local infrastructure for development
# Brings up Postgres 16 + Redis 7 with persistent volumes and healthchecks.
# Run:  docker compose up -d
# Stop: docker compose down        (keeps volumes)
# Wipe: docker compose down -v     (drops volumes too)

name: housing-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: housing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: housing
      POSTGRES_PASSWORD: housing_dev_pw_2026
      POSTGRES_DB: housing
      # Local dev: trust over TCP. Postgres only listens on the Docker host
      # loopback, so this is safe. Production uses managed Postgres
      # (Neon / Supabase / Render) and inherits that provider's auth.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      # Host-side port 55432 (the Windows host already has a native
      # postgresql-x64-18 service on 5432 — see docker compose logs).
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housing -d housing"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: housing-redis
    restart: unless-stopped
    # appendonly=yes keeps a tiny durability surface for the access-token
    # cache; we don't need it for production-style performance tuning.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
    name: housing-postgres-data
  redis-data:
    name: housing-redis-data
